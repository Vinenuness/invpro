<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Acompanhar Chamado - AtivoFix</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{width:100%;max-width:600px}.header{text-align:center;margin-bottom:32px}.logo{width:56px;height:56px;background:linear-gradient(135deg,#38bdf8,#818cf8);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.logo svg{width:30px;height:30px;color:white}.brand{font-size:28px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{font-size:14px;color:#64748b;margin-top:4px}.card{background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border:1px solid rgba(51,65,85,.4);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.card h2{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:4px}.card p{font-size:13px;color:#64748b;margin-bottom:24px}.form-group{margin-bottom:18px}.form-group label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.form-group input{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(51,65,85,.4);background:rgba(30,41,59,.5);color:#e2e8f0;font-size:14px;font-family:inherit;transition:all .2s}.form-group input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}.form-group input::placeholder{color:#475569}.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:white;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(56,189,248,.3)}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(56,189,248,.4)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}.results{margin-top:24px}.ticket-item{background:rgba(30,41,59,.5);border:1px solid rgba(51,65,85,.3);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s}.ticket-item:hover{border-color:rgba(56,189,248,.3)}.ticket-title{font-size:14px;font-weight:700;color:#e2e8f0;margin-bottom:6px}.ticket-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.ticket-desc{font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:8px}.ticket-dates{font-size:11px;color:#64748b}.badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600;display:inline-block}.badge-open{background:rgba(96,165,250,.15);color:#60a5fa}.badge-in_progress{background:rgba(250,204,21,.15);color:#facc15}.badge-resolved{background:rgba(34,197,94,.15);color:#22c55e}.badge-closed{background:rgba(148,163,184,.15);color:#94a3b8}.badge-low{background:rgba(34,197,94,.1);color:#4ade80}.badge-medium{background:rgba(250,204,21,.1);color:#facc15}.badge-high{background:rgba(251,146,60,.1);color:#fb923c}.badge-critical{background:rgba(239,68,68,.15);color:#f87171}.resolution-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12px}.resolution-box strong{color:#4ade80}.empty{text-align:center;padding:40px 20px;color:#64748b}.empty h3{font-size:16px;color:#94a3b8;margin-bottom:8px}.footer{text-align:center;margin-top:24px;font-size:12px;color:#475569}.links{text-align:center;margin-top:16px;font-size:13px}.links a{color:#38bdf8;text-decoration:none}.links a:hover{text-decoration:underline}@media(max-width:480px){.card{padding:24px 20px}}</style></head><body><div class="container"><div class="header"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div><div class="brand">AtivoFix</div><div class="subtitle">Acompanhar Chamado</div></div><div class="card" id="searchCard"><h2>Buscar Chamados</h2><p>Digite o email que voce usou ao abrir o chamado</p><div class="form-group"><label>Email</label><input type="email" id="fEmail" placeholder="Ex: joao@empresa.com"></div><button class="btn" onclick="trackTickets()" id="btnSearch">Buscar Chamados</button></div><div class="card" id="resultsCard" style="display:none"><h2>Seus Chamados</h2><p id="resultsEmail"></p><div class="results" id="resultsList"></div><button class="btn" style="background:linear-gradient(135deg,#818cf8,#6366f1);margin-top:16px" onclick="showSearch()">Buscar Outro Email</button></div><div class="footer">AtivoFix v2.0 - Gestao Inteligente de Inventario</div><div class="links"><a href="/abrir-chamado">Abrir Chamado</a> | <a href="/login">Area Administrativa</a></div></div><script>var SL={open:"Aberto",in_progress:"Em Andamento",resolved:"Resolvido",closed:"Fechado"};var PL={low:"Baixa",medium:"Media",high:"Alta",critical:"Critica"};function fmtD(s){if(!s)return"";try{var d=new Date(s);return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}catch(e){return s}}function trackTickets(){var email=document.getElementById("fEmail").value.trim();if(!email){alert("Digite seu email");return}var btn=document.getElementById("btnSearch");btn.disabled=true;btn.textContent="Buscando...";fetch("/api/tickets/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email})}).then(function(r){return r.json()}).then(function(d){document.getElementById("searchCard").style.display="none";document.getElementById("resultsCard").style.display="block";document.getElementById("resultsEmail").textContent="Resultados para: "+d.email;var el=document.getElementById("resultsList");if(!d.tickets.length){el.innerHTML="<div class="empty"><h3>Nenhum chamado encontrado</h3><p>Verifique se digitou o email correto</p></div>";return}var h="";d.tickets.forEach(function(t){h+="<div class="ticket-item"><div class="ticket-title">#"+t.ticket_id+" - "+t.title+"</div><div class="ticket-meta"><span class="badge badge-"+t.status+">"+SL[t.status]+"</span><span class="badge badge-"+t.priority+">"+PL[t.priority]+"</span></div>";if(t.description)h+="<div class="ticket-desc">"+t.description+"</div>";if(t.resolution_notes)h+="<div class="resolution-box"><strong>Resolucao:</strong> "+t.resolution_notes+"</div>";h+="<div class="ticket-dates">Criado: "+fmtD(t.created_at)+"</div>";if(t.resolved_at)h+="<div class="ticket-dates">Resolvido: "+fmtD(t.resolved_at)+"</div>";h+="</div>"});el.innerHTML=h}).catch(function(){alert("Erro ao buscar")}).finally(function(){btn.disabled=false;btn.textContent="Buscar Chamados"})}function showSearch(){document.getElementById("searchCard").style.display="block";document.getElementById("resultsCard").style.display="none"}</script></body></html>
