<!DOCTYPE html>
<html><head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Usuarios - AtivoFix</title>
<link rel="icon" href="/static/logo-icon.png" />
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
h1{margin:0;font-size:20px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,select{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;outline:none}
.btn{border:1px solid #334155;background:#0b1220;color:#e2e8f0;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12px}
.btn:hover{background:#0f1a2e}
.btn-primary{background:#2563eb;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{border-color:#ef4444;color:#ef4444}
.btn-danger:hover{background:#ef4444;color:#fff}
a{color:#e2e8f0;text-decoration:none}
.small{font-size:12px;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px}
.card:hover{transform:translateY(-2px);background:#22324a}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-weight:800;color:#fff;font-size:16px}
.muted{color:#94a3b8;font-size:13px;margin-top:6px;line-height:1.35}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modalBox{width:100%;max-width:520px;background:#111b33;border:1px solid #334155;border-radius:16px;padding:24px 28px;max-height:90vh;overflow-y:auto}
.modalTitle{font-weight:800;margin:0 0 18px 0;font-size:20px;color:#fff}
.modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #1e293b}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:4px;font-size:13px;color:#94a3b8}
.form-group input,.form-group select{width:100%;box-sizing:border-box}
.checkbox-group{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.checkbox-group label{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0b1220;border:1px solid #334155;border-radius:8px;cursor:pointer;font-size:13px}
.checkbox-group label:hover{border-color:#2563eb}
.pill{display:inline-block;background:#0b1220;border:1px solid #334155;border-radius:999px;padding:2px 8px;font-size:11px;color:#cbd5e1;margin:2px}
.pill-company{background:#0c4a6e;border-color:#0ea5e9;color:#7dd3fc}
.badge-admin{background:#065f46;border-color:#10b981;color:#6ee7b7}
.badge-unitadmin{background:#78350f;border-color:#f59e0b;color:#fcd34d}
.badge-tech{background:#1e3a8a;border-color:#3b82f6;color:#93c5fd}
.hidden{display:none !important}
</style></head><body>
<div class=top>
  <div class=left><a href=/>Voltar</a><h1>Usuarios</h1><div class=small id=count></div></div>
  <button class="btn btn-primary hidden" id=btnNew onclick=openCreateModal()>+ Novo Usuario</button>
</div>
<div id=grid class=grid></div>
<div id=modal class=modal onclick=hideModal()><div class=modalBox onclick=event.stopPropagation()>
<h3 class=modalTitle id=modalTitle>Novo Usuario</h3>
<div class="form-group hidden" id=tenantGroup><label>Empresa *</label><select id=userTenant onchange=onTenantChange()><option value="">Carregando...</option></select></div>
<div class=form-group><label>Nome *</label><input id=userName placeholder="Ex: Joao Silva" /></div>
<div class=form-group><label>Email *</label><input id=userEmail type=email placeholder="Ex: joao@email.com" /></div>
<div class=form-group><label id=passwordLabel>Senha *</label><input id=userPassword type=password placeholder="Minimo 6 caracteres" /></div>
<div class=form-group><label>Perfil</label>
<select id=userRole>
  <option value=tech>Tecnico</option>
  <option value=unit_admin>Admin da Unidade</option>
  <option value=master>Admin da Empresa</option>
</select></div>
<div class=form-group><label><input type=checkbox id=userManageScripts style="width:auto"> Pode gerenciar Scripts / Jobs</label><div class=small>Permite criar, editar e executar scripts e jobs</div></div>
<div class="form-group" id=unitGroup><label>Unidades <span class=small id=unitHint></span></label><div id=unitCheckboxes class=checkbox-group></div></div>
<div class=modalActions><button class=btn onclick=hideModal()>Cancelar</button><button class="btn btn-primary" onclick=saveUser()>Salvar</button></div>
</div></div>
<script>
var users=[],allUnits=[],tenants=[],editingId=null,myRole="master",myUnitIds=null,platform=false,defaultTenant=null;
async function loadMe(){try{var m=await (await fetch("/api/me")).json();myRole=m.role||"master";myUnitIds=m.unit_ids;platform=(m.user_id==null);defaultTenant=m.tenant_id||null;if(myRole==="master"||myRole==="unit_admin"){document.getElementById("btnNew").classList.remove("hidden");}var sel=document.getElementById("userRole");for(var i=sel.options.length-1;i>=0;i--){if(myRole!=="master"&&sel.options[i].value==="master")sel.remove(i);}if(platform){document.getElementById("tenantGroup").classList.remove("hidden");await loadTenants();}}catch(e){console.error(e)}}
async function loadTenants(){var t=await (await fetch("/api/tenants")).json();tenants=t;var ts=document.getElementById("userTenant");ts.innerHTML="";t.forEach(function(x){var o=document.createElement("option");o.value=x.tenant_id;o.textContent=x.name;ts.appendChild(o);});if(defaultTenant&&t.some(function(x){return x.tenant_id===defaultTenant})){ts.value=defaultTenant;}else if(t.length){ts.value=t[0].tenant_id;}}
function currentTenantId(){if(!platform)return null;var v=document.getElementById("userTenant").value;return v?parseInt(v):null;}
function tenantName(tid){var t=tenants.find(function(x){return x.tenant_id===tid});return t?t.name:"";}
async function onTenantChange(){var tid=currentTenantId();if(!tid){allUnits=[];renderUnitCheckboxes([]);return;}allUnits=await (await fetch("/api/units?tenant_id="+tid)).json();renderUnitCheckboxes([]);}
async function load(){users=await (await fetch("/api/users")).json();if(!platform){allUnits=await (await fetch("/api/units")).json();}else if(!allUnits.length){await onTenantChange();}render();}
function roleLabel(u){var b=u.is_admin?"<span class='pill badge-admin'>Admin da Empresa</span>":(u.is_unit_admin?"<span class='pill badge-unitadmin'>Admin de Unidade</span>":"<span class='pill badge-tech'>Tecnico</span>");if(u.manage_scripts)b+=" <span class='pill' style='border-color:#38bdf8;color:#38bdf8'>Scripts</span>";return b;}
function canManage(){return myRole==="master"||myRole==="unit_admin";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){var g=document.getElementById("grid");document.getElementById("count").innerText=users.length+" usuarios";if(!users.length){g.innerHTML="<div class=muted>Nenhum usuario.</div>";return;}g.innerHTML=users.map(function(u){var actions="";if(canManage()){actions="<div style=display:flex;gap:6px><button class=btn onclick=openEditModal("+u.user_id+")>Editar</button><button class='btn btn-danger' onclick=deleteUser("+u.user_id+")>Excluir</button></div>";}var comp="";if(platform&&u.tenant_name)comp=" <span class='pill pill-company'>"+esc(u.tenant_name)+"</span>";return"<div class=card><div class=row><div><div class=title>"+esc(u.username)+"</div><div class=muted>"+esc(u.email)+"</div><div style=margin-top:6px>"+roleLabel(u)+comp+"</div><div id=units-"+u.user_id+" class=small style=margin-top:6px></div></div>"+actions+"</div></div>"}).join("");users.forEach(function(u){fetch("/api/users/"+u.user_id+"/units").then(function(r){return r.json()}).then(function(us){var e=document.getElementById("units-"+u.user_id);if(!e)return;e.innerHTML=us.length?us.map(function(x){return"<span class=pill>"+esc(x.name)+"</span>"}).join(" "):"<span class=pill style=border-color:#f59e0b;color:#f59e0b>Sem unidade</span>"})});}
function renderUnitCheckboxes(s){s=s||[];var c=document.getElementById("unitCheckboxes");var h=document.getElementById("unitHint");if(platform)h.textContent="da empresa "+tenantName(currentTenantId());else h.textContent="";if(!allUnits.length){c.innerHTML="<div class=muted>Crie em <a href=/unidades>Unidades</a>.</div>";return;}var restrict=myUnitIds?myUnitIds.slice():null;c.innerHTML=allUnits.filter(function(u){return !restrict||restrict.indexOf(u.unit_id)>=0}).map(function(u){return"<label><input type=checkbox name=unit value="+u.unit_id+" "+(s.indexOf(u.unit_id)>=0?"checked":"")+" /> "+esc(u.name)+"</label>"}).join("");}
function getSelectedUnitIds(){var c=document.querySelectorAll("input[name=unit]:checked");var ids=[];for(var i=0;i<c.length;i++)ids.push(parseInt(c[i].value));return ids;}
async function openCreateModal(){editingId=null;document.getElementById("modalTitle").innerText="Novo Usuario";document.getElementById("userName").value="";document.getElementById("userEmail").value="";document.getElementById("userPassword").value="";document.getElementById("userPassword").required=true;document.getElementById("passwordLabel").innerText="Senha *";document.getElementById("userRole").value="tech";document.getElementById("userManageScripts").checked=false;if(platform){var ts=document.getElementById("userTenant");if(ts.options.length&&(ts.value==""||!tenantName(currentTenantId()))){ts.value=(defaultTenant&&tenants.some(function(x){return x.tenant_id===defaultTenant}))?defaultTenant:ts.options[0].value;}await onTenantChange();}else{renderUnitCheckboxes([]);}document.getElementById("modal").style.display="flex";}
async function openEditModal(uid){editingId=uid;var u=users.find(function(x){return x.user_id===uid});if(!u)return;document.getElementById("modalTitle").innerText="Editar";document.getElementById("userName").value=u.username;document.getElementById("userEmail").value=u.email;document.getElementById("userPassword").value="";document.getElementById("userPassword").required=false;document.getElementById("passwordLabel").innerText="Senha (deixe vazio)";document.getElementById("userRole").value=u.is_admin?"master":(u.is_unit_admin?"unit_admin":"tech");document.getElementById("userManageScripts").checked=!!u.manage_scripts;if(platform){var ts=document.getElementById("userTenant");if(ts.options.length){ts.value=String(u.tenant_id);await onTenantChange();}}var us=await (await fetch("/api/users/"+uid+"/units")).json();renderUnitCheckboxes(us.map(function(x){return x.unit_id}));document.getElementById("modal").style.display="flex";}
function hideModal(){document.getElementById("modal").style.display="none";}
async function saveUser(){var un=document.getElementById("userName").value.trim();var e=document.getElementById("userEmail").value.trim();var p=document.getElementById("userPassword").value;var role=document.getElementById("userRole").value;var uid=getSelectedUnitIds();if(!un||!e){alert("Preencha nome e email");return;}if(!editingId&&!p){alert("Informe a senha");return;}if(p&&p.length<6){alert("Senha deve ter no minimo 6 caracteres");return;}if(role!=="master"&&!uid.length){alert("Selecione pelo menos uma unidade para Tecnico/Admin de Unidade");return;}var tid=currentTenantId();if(platform&&!tid){alert("Selecione a empresa");return;}var b={username:un,email:e,is_admin:(role==="master"),is_unit_admin:(role==="unit_admin"),manage_scripts:document.getElementById("userManageScripts").checked?1:0};if(platform)b.tenant_id=tid;if(p)b.password=p;var url=editingId?"/api/users/"+editingId:"/api/users";var r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});if(!r.ok){var err=await r.json();alert(err.error||"Erro ao salvar");return;}var res=await r.json();var userId=editingId||res.user_id;if(userId){var ub={unit_ids:uid};if(platform)ub.tenant_id=tid;var ur=await fetch("/api/users/"+userId+"/units",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(ub)});if(!ur.ok){var uerr=await ur.json();alert(uerr.error||"Erro ao vincular unidades");}}hideModal();await load();}
async function deleteUser(id){if(!confirm("Excluir usuario?"))return;var r=await fetch("/api/users/"+id,{method:"DELETE"});if(!r.ok){var err=await r.json();alert(err.error||"Erro");return;}await load();}
(async function(){await loadMe();await load();})();
</script></body></html>
