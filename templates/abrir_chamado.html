<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Abrir Chamado - InvPro</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,-apple-system,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.container{width:100%;max-width:520px}.header{text-align:center;margin-bottom:32px}.logo{width:56px;height:56px;background:linear-gradient(135deg,#38bdf8,#818cf8);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.logo svg{width:30px;height:30px;color:white}.brand{font-size:28px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.subtitle{font-size:14px;color:#64748b;margin-top:4px}.card{background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border:1px solid rgba(51,65,85,.4);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}.card h2{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:4px}.card p{font-size:13px;color:#64748b;margin-bottom:24px}.form-group{margin-bottom:18px}.form-group label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(51,65,85,.4);background:rgba(30,41,59,.5);color:#e2e8f0;font-size:14px;font-family:inherit;transition:all .2s}.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}.form-group textarea{min-height:120px;resize:vertical}.form-group input::placeholder,.form-group textarea::placeholder{color:#475569}.btn-submit{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(34,197,94,.3)}.btn-submit:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(34,197,94,.4)}.btn-submit:active{transform:translateY(0)}.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none}.success{text-align:center;padding:40px 20px}.success .check{width:64px;height:64px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}.success .check svg{width:32px;height:32px;color:#22c55e}.success h3{font-size:20px;color:#f1f5f9;margin-bottom:8px}.success p{font-size:14px;color:#94a3b8;margin-bottom:24px}.btn-new{padding:10px 24px;border-radius:10px;border:1px solid rgba(51,65,85,.4);background:rgba(30,41,59,.5);color:#e2e8f0;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}.btn-new:hover{border-color:#38bdf8;color:#38bdf8}.footer{text-align:center;margin-top:24px;font-size:12px;color:#475569}@media(max-width:480px){.card{padding:24px 20px}}</style></head><body><div class="container"><div class="header"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div><div class="brand">InvPro</div><div class="subtitle">Sistema de Suporte Tecnico</div></div><div class="card" id="formCard"><h2>Abrir Chamado</h2><p>Descreva seu problema e enviaremos para o suporte tecnico</p><div class="form-group"><label>Seu Nome *</label><input type="text" id="fName" placeholder="Ex: Joao Silva"></div><div class="form-group"><label>Seu Email</label><input type="email" id="fEmail" placeholder="Ex: joao@empresa.com"></div><div class="form-group"><label>Titulo do Problema *</label><input type="text" id="fTitle" placeholder="Ex: Computador nao liga"></div><div class="form-group"><label>Descricao Detalhada *</label><textarea id="fDesc" placeholder="Descreva o problema com detalhes: o que aconteceu, quando comecou, o que ja tentou..."></textarea></div><div class="form-group"><label>Prioridade</label><select id="fPri"><option value="low">Baixa - Nao atrapalha o trabalho</option><option value="medium" selected>Media - Atrapalha um pouco</option><option value="high">Alta - Nao consigo trabalhar</option><option value="critical">Critica - Sistema parado</option></select></div><button class="btn-submit" onclick="submitTicket()">Enviar Chamado</button></div><div class="card" id="successCard" style="display:none"><div class="success"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div><h3>Chamado Enviado!</h3><p>Seu chamado foi registrado com sucesso. O time de suporte entrara em contato.</p><button class="btn-new" onclick="resetForm()">Abrir Outro Chamado</button></div></div><div class="footer">InvPro v2.0 - Gestao Inteligente de Inventario</div><div style="text-align:center;margin-top:16px;font-size:13px"><a href="/acompanhar-chamado" style="color:#38bdf8;text-decoration:none">Acompanhar meus chamados</a></div></div><script>function submitTicket(){var n=document.getElementById("fName").value.trim();var t=document.getElementById("fTitle").value.trim();var d=document.getElementById("fDesc").value.trim();if(!n||!t||!d){alert("Preencha nome, titulo e descricao");return}var btn=document.querySelector(".btn-submit");btn.disabled=true;btn.textContent="Enviando...";fetch("/api/tickets/public",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:t,description:d,priority:document.getElementById("fPri").value,created_by:n,email:document.getElementById("fEmail").value.trim()||null})}).then(function(r){return r.json()}).then(function(d){if(d.ok){document.getElementById("formCard").style.display="none";document.getElementById("successCard").style.display="block"}else{alert(d.error||"Erro ao enviar");btn.disabled=false;btn.textContent="Enviar Chamado"}}).catch(function(){alert("Erro de conexao");btn.disabled=false;btn.textContent="Enviar Chamado"})}function resetForm(){document.getElementById("fName").value="";document.getElementById("fEmail").value="";document.getElementById("fTitle").value="";document.getElementById("fDesc").value="";document.getElementById("fPri").value="medium";document.getElementById("formCard").style.display="block";document.getElementById("successCard").style.display="none";var btn=document.querySelector(".btn-submit");btn.disabled=false;btn.textContent="Enviar Chamado"}</script></body></html>
