<!DOCTYPE html><html lang="pt-BR"><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1.0"><title>Abrir Chamado - AtivoFix</title>
<link rel="icon" href="/static/logo-icon.png" /><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel=stylesheet><style>*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.ctr{width:100%;max-width:560px}
.hed{text-align:center;margin-bottom:32px}
.log{width:56px;height:56px;background:linear-gradient(135deg,#38bdf8,#818cf8);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.log svg{width:30px;height:30px;color:white}
.brd{font-size:28px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:14px;color:#64748b;margin-top:4px}
.cdr{background:rgba(15,23,42,.95);backdrop-filter:blur(20px);border:1px solid rgba(51,65,85,.4);border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.cdr h2{font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
.cdr p{font-size:13px;color:#64748b;margin-bottom:24px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.fg input,.fg textarea,.fg select{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(51,65,85,.4);background:rgba(30,41,59,.5);color:#e2e8f0;font-size:14px;font-family:inherit;transition:all .2s}
.fg input:focus,.fg textarea:focus,.fg select:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.fg select option{background:#1e293b;color:#e2e8f0}
.fg textarea{min-height:120px;resize:vertical}
.fg input::placeholder,.fg textarea::placeholder{color:#475569}
.bts{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;box-shadow:0 4px 16px rgba(34,197,94,.3)}
.bts:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(34,197,94,.4)}
.bts:disabled{opacity:.5;cursor:not-allowed;transform:none}
.scc{text-align:center;padding:40px 20px}
.chf{width:64px;height:64px;background:rgba(34,197,94,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.chf svg{width:32px;height:32px;color:#22c55e}
.scc h3{font-size:20px;color:#f1f5f9;margin-bottom:8px}
.scc p{font-size:14px;color:#94a3b8;margin-bottom:24px}
.btnn{padding:10px 24px;border-radius:10px;border:1px solid rgba(51,65,85,.4);background:rgba(30,41,59,.5);color:#e2e8f0;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.btnn:hover{border-color:#38bdf8;color:#38bdf8}
.ftr{text-align:center;margin-top:24px;font-size:12px;color:#475569}
.links{text-align:center;margin-top:16px;font-size:13px}
.links a{color:#38bdf8;text-decoration:none}
.hmt{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;margin:0 auto 24px;font-size:13px;color:#64748b}
.hmt span{color:#38bdf8;font-weight:600}
@media(max-width:480px){.cdr{padding:24px 20px}}</style></head><body><div class=ctr><div class=hed><div class=log><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div><div class=brd>AtivoFix</div><div class=sub>Sistema de Suporte Tecnico</div></div><div class=hmt><span><a href=/ style=color:#64748b>Login</a></span> <span><a href=/abrir-chamado style=color:#38bdf8>Abrir Chamado</a></span></div><div class=cdr id=fc><h2>Abrir Chamado</h2><p>Descreva seu problema e enviaremos para o suporte</p><div class=fg><label>Seu Nome *</label><input type=text id=fN placeholder="Ex: Joao Silva"></div><div class=fg><label>Empresa *</label><select id=fT><option value="">Carregando...</option></select></div><div class=fg id=UG style="display:none"><label>Unidade</label><select id=fU><option value="">Carregando...</option></select></div><div class=fg id=LG style="display:none"><label>Local</label><select id=fL><option value="">Carregando...</option></select></div><div class=fg><label>Seu Email</label><input type=email id=fE placeholder="Ex: joao@empresa.com"></div><div class=fg><label>Titulo *</label><input type=text id=fT2 placeholder="Ex: Computador nao liga"></div><div class=fg><label>Descricao *</label><textarea id=fD placeholder="Descreva o problema com detalhes..."></textarea></div><div class=fg><label>Prioridade</label><select id=fP><option value=low>Baixa</option><option value=medium selected>Media</option><option value=high>Alta</option><option value=critical>Critica</option></select></div><button class=bts onclick="sub()">Enviar Chamado</button></div><div class=cdr id=SC style="display:none"><div class=scc><div class=chf><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div><h3>Chamado Enviado!</h3><p>Seu chamado foi registrado. O suporte entrara em contato.</p><button class=btnn onclick="resetForm()">Abrir Outro</button></div></div><div class=ftr>AtivoFix v2.0</div><div class=links><a href=/acompanhar-chamado>Acompanhar Meus Chamados</a> | <a href=/base-conhecimento>Base de Conhecimento</a></div></div><script src="/abrir-chamado.js"></script></body></html>
