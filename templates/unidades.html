<!DOCTYPE html>
<html><head>
<meta charset="UTF-8" />
<title>Unidades - InvPro</title>
<style>
body{font-family:Arial;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
h1{margin:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,select,textarea{padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;outline:none}
textarea{min-height:80px;resize:vertical}
.btn{border:1px solid #334155;background:#0b1220;color:#e2e8f0;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12px}
.btn:hover{background:#0f1a2e}
.btn-primary{background:#2563eb;border-color:#2563eb}
.btn-primary:hover{background:#1d4ed8}
.btn-danger{border-color:#ef4444;color:#ef4444}
.btn-danger:hover{background:#ef4444;color:#fff}
.btn-sm{padding:4px 8px;font-size:11px}
a{color:#e2e8f0;text-decoration:none}
.small{font-size:12px;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:14px}
.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:16px}
.card:hover{transform:translateY(-2px);background:#22324a;transition:all .2s}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.title{font-weight:800;color:#fff;font-size:16px}
.muted{color:#94a3b8;font-size:13px;margin-top:4px;line-height:1.35}
.stats{display:flex;gap:10px;margin-top:8px}
.stat{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:4px 10px;font-size:12px}
.stat b{color:#fff}
.locations-section{margin-top:12px;padding-top:10px;border-top:1px solid #334155}
.loc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.loc-title{font-size:13px;font-weight:700;color:#94a3b8}
.loc-list{display:flex;flex-direction:column;gap:6px}
.loc-item{display:flex;justify-content:space-between;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:6px 10px;font-size:12px}
.loc-name{color:#e2e8f0;font-weight:600}
.loc-desc{color:#94a3b8;font-size:11px}
.loc-pcs{color:#3b82f6;font-size:11px}
.loc-actions{display:flex;gap:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modalBox{width:100%;max-width:520px;background:#111b33;border:1px solid #334155;border-radius:16px;padding:24px 28px}
.modalTitle{font-weight:800;margin:0 0 18px 0;font-size:20px;color:#fff}
.modalActions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #1e293b}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#94a3b8;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e2e8f0;font-size:14px;transition:border-color .2s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:#2563eb;outline:none}
</style></head><body>
<div class=top><div class=left><a href=/>&#8592; Voltar</a><h1>Unidades</h1><div class=small id=count></div></div>
<button class="btn btn-primary" onclick="openUnitModal()">+ Nova Unidade</button></div>
<div id=grid class=grid></div>
<div id=unitModal class=modal onclick="hideUnitModal()"><div class=modalBox onclick="event.stopPropagation()">
<h3 class=modalTitle id=unitModalTitle>Nova Unidade</h3>
<div class=form-group><label>Nome *</label><input id=unitName placeholder="Ex: HSL Garca" /></div>
<div class=form-group><label>Descricao</label><textarea id=unitDesc placeholder="Descricao da unidade..."></textarea></div>
<div class=modalActions><button class=btn onclick="hideUnitModal()">Cancelar</button><button class="btn btn-primary" onclick="saveUnit()">Salvar</button></div>
</div></div>
<div id=locModal class=modal onclick="hideLocModal()"><div class=modalBox onclick="event.stopPropagation()">
<h3 class=modalTitle id=locModalTitle>Novo Local</h3>
<div class=form-group><label>Nome *</label><input id=locName placeholder="Ex: Administrativo" /></div>
<div class=form-group><label>Descricao</label><textarea id=locDesc placeholder="Descricao do local..."></textarea></div>
<div class=modalActions><button class=btn onclick="hideLocModal()">Cancelar</button><button class="btn btn-primary" onclick="saveLocation()">Salvar</button></div>
</div></div>
<script>
var units=[],locations=[],computers=[],editingUnitId=null,editingLocId=null,locUnitId=null;
async function load(){var u=await fetch("/api/units");units=await u.json();var l=await fetch("/api/locations");locations=await l.json();var c=await fetch("/api/computers");var cd=await c.json();computers=cd.computers||[];render();}
function getLocsForUnit(uid){return locations.filter(function(l){return l.unit_id==uid;});}
function getPcsForLocation(lid){return computers.filter(function(c){return c.location_id==lid;});}
function render(){var g=document.getElementById("grid");g.innerHTML="";document.getElementById("count").innerText=units.length+" unidades";if(!units.length){var m=document.createElement("div");m.className="muted";m.textContent="Nenhuma unidade cadastrada.";g.appendChild(m);return;}for(var i=0;i<units.length;i++){var u=units[i];var ul=getLocsForUnit(u.unit_id);var tp=0;for(var j=0;j<ul.length;j++){tp+=getPcsForLocation(ul[j].location_id).length;}var card=document.createElement("div");card.className="card";var tr=document.createElement("div");tr.className="row";var left=document.createElement("div");var t=document.createElement("div");t.className="title";t.textContent=u.name;left.appendChild(t);var d=document.createElement("div");d.className="muted";d.textContent=u.description||"Sem descricao";left.appendChild(d);var st=document.createElement("div");st.className="stats";var s1=document.createElement("div");s1.className="stat";var b1=document.createElement("b");b1.textContent=ul.length;s1.appendChild(b1);s1.appendChild(document.createTextNode(" Locais"));st.appendChild(s1);var s2=document.createElement("div");s2.className="stat";var b2=document.createElement("b");b2.textContent=tp;s2.appendChild(b2);s2.appendChild(document.createTextNode(" PCs"));st.appendChild(s2);left.appendChild(st);tr.appendChild(left);var right=document.createElement("div");right.style.cssText="display:flex;gap:6px";var eb=document.createElement("button");eb.className="btn";eb.textContent="Editar";(function(x){eb.onclick=function(){openUnitModal(x);};})(i);right.appendChild(eb);var db=document.createElement("button");db.className="btn btn-danger";db.textContent="Excluir";(function(uid){db.onclick=function(){deleteUnit(uid);};})(u.unit_id);right.appendChild(db);tr.appendChild(right);card.appendChild(tr);var ls=document.createElement("div");ls.className="locations-section";var lh=document.createElement("div");lh.className="loc-header";var lt=document.createElement("div");lt.className="loc-title";lt.textContent="Locais";lh.appendChild(lt);var ab=document.createElement("button");ab.className="btn btn-primary btn-sm";ab.textContent="+ Novo Local";(function(uid){ab.onclick=function(){openLocModal(uid);};})(u.unit_id);lh.appendChild(ab);ls.appendChild(lh);var ll=document.createElement("div");ll.className="loc-list";if(ul.length==0){var em=document.createElement("div");em.className="muted";em.style.fontSize="12px";em.textContent="Nenhum local.";ll.appendChild(em);}else{for(var k=0;k<ul.length;k++){var loc=ul[k];var pc=getPcsForLocation(loc.location_id).length;var it=document.createElement("div");it.className="loc-item";var il=document.createElement("div");var nm=document.createElement("span");nm.className="loc-name";nm.textContent=loc.name;il.appendChild(nm);if(loc.description){var ds=document.createElement("span");ds.className="loc-desc";ds.textContent=" - "+loc.description;il.appendChild(ds);}it.appendChild(il);var ir=document.createElement("div");ir.style.cssText="display:flex;align-items:center;gap:8px";var pc2=document.createElement("span");pc2.className="loc-pcs";pc2.textContent=pc+" PCs";ir.appendChild(pc2);var ac=document.createElement("div");ac.className="loc-actions";var e2=document.createElement("button");e2.className="btn btn-sm";e2.textContent="E";(function(lid){e2.onclick=function(){openLocModal(null,lid);};})(loc.location_id);ac.appendChild(e2);var d2=document.createElement("button");d2.className="btn btn-sm btn-danger";d2.textContent="X";(function(lid){d2.onclick=function(){deleteLocation(lid);};})(loc.location_id);ac.appendChild(d2);ir.appendChild(ac);it.appendChild(ir);ll.appendChild(it);}}ls.appendChild(ll);card.appendChild(ls);g.appendChild(card);}}
function openUnitModal(idx){if(idx!==null&&idx!==undefined){var u=units[idx];editingUnitId=u.unit_id;document.getElementById("unitModalTitle").innerText="Editar Unidade";document.getElementById("unitName").value=u.name;document.getElementById("unitDesc").value=u.description||"";}else{editingUnitId=null;document.getElementById("unitModalTitle").innerText="Nova Unidade";document.getElementById("unitName").value="";document.getElementById("unitDesc").value="";}document.getElementById("unitModal").style.display="flex";}
function hideUnitModal(){document.getElementById("unitModal").style.display="none";}
async function saveUnit(){var n=document.getElementById("unitName").value.trim();var d=document.getElementById("unitDesc").value.trim();if(!n){alert("Nome obrigatorio");return;}var u="/api/units";if(editingUnitId)u+="/"+editingUnitId;var r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,description:d})});if(!r.ok){var e=await r.json();alert(e.error||"Erro");return;}hideUnitModal();await load();}
async function deleteUnit(id){if(!confirm("Excluir unidade?"))return;await fetch("/api/units/"+id,{method:"DELETE"});await load();}
function openLocModal(uid,lid){locUnitId=uid;if(lid){var loc=locations.find(function(l){return l.location_id==lid;});if(!loc)return;editingLocId=lid;locUnitId=loc.unit_id;document.getElementById("locModalTitle").innerText="Editar Local";document.getElementById("locName").value=loc.name;document.getElementById("locDesc").value=loc.description||"";}else{editingLocId=null;document.getElementById("locModalTitle").innerText="Novo Local";document.getElementById("locName").value="";document.getElementById("locDesc").value="";}document.getElementById("locModal").style.display="flex";}
function hideLocModal(){document.getElementById("locModal").style.display="none";}
async function saveLocation(){var n=document.getElementById("locName").value.trim();var d=document.getElementById("locDesc").value.trim();if(!n){alert("Nome obrigatorio");return;}var u="/api/locations";if(editingLocId)u+="/"+editingLocId;var r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({unit_id:locUnitId,name:n,description:d})});if(!r.ok){var e=await r.json();alert(e.error||"Erro");return;}hideLocModal();await load();}
async function deleteLocation(id){if(!confirm("Excluir local?"))return;await fetch("/api/locations/"+id,{method:"DELETE"});await load();}
load();
</script></body></html>
