<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtivoFix - Login</title>
<link rel="icon" href="/static/logo-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #0a0e1a 0%, #111827 50%, #0f172a 100%); color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; }
    .bg-glow { position: fixed; width: 600px; height: 600px; border-radius: 50%; filter: blur(120px); opacity: 0.15; pointer-events: none; }
    .bg-glow-1 { top: -200px; left: -100px; background: #38bdf8; }
    .bg-glow-2 { bottom: -200px; right: -100px; background: #818cf8; }
    .login-container { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
    .logo-section { text-align: center; margin-bottom: 32px; }
    .logo-icon { width: 72px; height: 72px; margin: 0 auto 16px; background: linear-gradient(135deg, #38bdf8, #818cf8); border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(56,189,248,0.3); }
    .logo-icon svg { width: 40px; height: 40px; color: white; }
    .logo-title { font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -0.5px; }
    .logo-subtitle { font-size: 14px; color: #64748b; margin-top: 6px; font-weight: 500; }
    .login-card { background: rgba(15,23,42,0.8); backdrop-filter: blur(20px); border: 1px solid rgba(51,65,85,0.5); border-radius: 20px; padding: 32px; box-shadow: 0 25px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05); }
    .form-header { margin-bottom: 24px; }
    .form-header h2 { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .form-header p { font-size: 13px; color: #64748b; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-wrapper { position: relative; }
    .input-wrapper svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #475569; pointer-events: none; }
    .input-wrapper input { width: 100%; padding: 14px 14px 14px 44px; border-radius: 12px; border: 1px solid rgba(51,65,85,0.5); background: rgba(15,23,42,0.6); color: #f8fafc; font-size: 14px; font-family: inherit; transition: all 0.2s ease; }
    .input-wrapper input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.15); }
    .input-wrapper input::placeholder { color: #475569; }
    .login-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #38bdf8, #818cf8); color: white; font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; margin-top: 8px; transition: all 0.2s ease; box-shadow: 0 4px 16px rgba(56,189,248,0.3); }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(56,189,248,0.4); }
    .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-top: 16px; display: flex; align-items: center; gap: 8px; }
    .footer-links { text-align: center; margin-top: 24px; font-size: 12px; color: #475569; }
    .footer-links a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    .version { text-align: center; margin-top: 24px; font-size: 11px; color: #334155; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="login-container">
    <div class="logo-section">
      <img src="/static/logo.png" alt="AtivoFix" style="max-width:260px;width:100%;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.35)" />
      <div class="logo-subtitle">Sistema de Gestão de Inventário de TI</div>
    </div>
    <div class="login-card">
      <div class="form-header"><h2>Bem-vindo de volta</h2><p>Entre com suas credenciais para acessar o painel</p></div>
      <form method="POST" action="/login">
        <div class="input-group"><label>Usuario</label><div class="input-wrapper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><input name="username" type="text" placeholder="seu.usuario" required autocomplete="username" /></div></div>
        <div class="input-group"><label>Senha</label><div class="input-wrapper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg><input name="password" type="password" placeholder="Digite sua senha" required autocomplete="current-password" /></div></div>
        <button type="submit" class="login-btn">Entrar no Painel</button>
      </form>
      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
      <div class="footer-links"><a href="/forgot-password">Esqueci minha senha</a></div>
    </div>
    <div class="version">AtivoFix v2.0 - Gestao Inteligente de Inventario</div>
  </div>
</body>
</html>
