<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Painel</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #111827); color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; }
    .card { width: min(92vw, 420px); background: #111b33; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #94a3b8; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #cbd5e1; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #f8fafc; }
    button { width: 100%; margin-top: 16px; padding: 10px 12px; border: none; border-radius: 10px; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
    .error { margin-top: 12px; color: #fda4af; font-size: 13px; }
    .hint { margin-top: 10px; font-size: 12px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Entrar no painel</h1>
    <p>Use suas credenciais para acessar o inventário.</p>
    <form method="POST" action="/login">
      <label>Usuário</label>
      <input name="username" required autocomplete="username" />
      <label>Senha</label>
      <input name="password" type="password" required autocomplete="current-password" />
      <button type="submit">Entrar</button>
    </form>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <div class="hint">Credenciais padrão: admin / admin</div>
    <div class="hint"><a href="/forgot-password" style="color:#7dd3fc">Esqueci minha senha</a></div>
  </div>
</body>
</html>
