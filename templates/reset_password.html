<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova senha</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #0f172a, #111827); color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; }
    .card { width: min(92vw, 420px); background: #111b33; border: 1px solid #334155; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #94a3b8; margin-top: 0; }
    input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid #334155; background: #0b1220; color: #f8fafc; }
    button { width: 100%; margin-top: 16px; padding: 10px 12px; border: none; border-radius: 10px; background: #38bdf8; color: #082f49; font-weight: 700; cursor: pointer; }
    .success { margin-top: 12px; color: #86efac; font-size: 13px; }
    .error { margin-top: 12px; color: #fda4af; font-size: 13px; }
    a { color: #7dd3fc; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Definir nova senha</h1>
    <p>Informe a nova senha para acessar o painel.</p>
    <form method="POST" action="/reset-password/{{ token }}">
      <input name="password" type="password" placeholder="Nova senha" required />
      <button type="submit">Salvar nova senha</button>
    </form>
    {% if success %}
      <div class="success">{{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <p style="margin-top: 14px"><a href="/login">Voltar para o login</a></p>
  </div>
</body>
</html>
