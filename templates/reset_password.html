<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AtivoFix - Nova senha</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,sans-serif;background:linear-gradient(135deg,#0a0e1a,#111827 50%,#0f172a);color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
    .g1{position:fixed;inset:0;background-image:linear-gradient(rgba(56,189,248,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
    .gl{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.15;pointer-events:none}
    .gla{top:-200px;left:-100px;background:#38bdf8}.glb{bottom:-200px;right:-100px;background:#818cf8}
    .box{position:relative;z-index:1;width:100%;max-width:440px}
    .lg{text-align:center;margin-bottom:28px}
    .li{width:72px;height:72px;margin:0 auto 14px;background:linear-gradient(135deg,#38bdf8,#818cf8);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(56,189,248,.3)}
    .li svg{width:40px;height:40px;color:#fff}
    .lt{font-size:32px;font-weight:800;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
    .ls{font-size:14px;color:#64748b;margin-top:6px}
    .cd{background:rgba(15,23,42,.85);border:1px solid rgba(51,65,85,.5);border-radius:20px;padding:32px;box-shadow:0 25px 50px rgba(0,0,0,.4)}
    .fh h2{font-size:20px;color:#f8fafc;margin-bottom:4px}
    .fh p{font-size:13px;color:#64748b;margin-bottom:22px;line-height:1.5}
    label{display:block;font-size:12px;font-weight:600;color:#94a3b8;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .in{position:relative;margin-bottom:16px}
    .in svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#475569;pointer-events:none}
    .in input{width:100%;padding:14px 14px 14px 44px;border-radius:12px;border:1px solid rgba(51,65,85,.5);background:rgba(15,23,42,.6);color:#f8fafc;font-size:14px;font-family:inherit;transition:all .2s}
    .in input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
    .in input::placeholder{color:#475569}
    .btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;box-shadow:0 4px 16px rgba(56,189,248,.3);transition:all .2s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(56,189,248,.4)}
    .ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac;padding:12px 16px;border-radius:10px;font-size:13px;margin-top:16px;line-height:1.5}
    .er{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5;padding:12px 16px;border-radius:10px;font-size:13px;margin-top:16px;line-height:1.5}
    .fl{text-align:center;margin-top:20px;font-size:13px}
    .fl a{color:#38bdf8;text-decoration:none;font-weight:500}
    .vr{text-align:center;margin-top:22px;font-size:11px;color:#334155}
  </style>
</head>
<body>
  <div class="g1"></div><div class="gl gla"></div><div class="gl glb"></div>
  <div class="box">
    <div class="lg">
      <div class="li"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <div class="lt">AtivoFix</div><div class="ls">Sistema de Gestao de Inventario de TI</div>
    </div>
    <div class="cd">
      <div class="fh"><h2>Definir nova senha</h2><p>Crie uma nova senha para acessar o painel.</p></div>
      {% if not success %}
      <form method="POST" action="/reset-password/{{ token }}">
        <div class="in"><label>Nova senha</label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input name="password" type="password" placeholder="Minimo 6 caracteres" required minlength="6" autocomplete="new-password" /></div>
        <div class="in"><label>Confirmar senha</label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input name="confirm" type="password" placeholder="Repita a nova senha" required minlength="6" autocomplete="new-password" /></div>
        <button type="submit" class="btn">Salvar nova senha</button>
      </form>
      {% endif %}
      {% if success %}<div class="ok">{{ success }}</div>{% endif %}
      {% if error %}<div class="er">{{ error }}</div>{% endif %}
      <div class="fl"><a href="/login">Voltar para o login</a></div>
    </div>
    <div class="vr">AtivoFix v2.0 - Gestao Inteligente de Inventario</div>
  </div>
</body>
</html>
