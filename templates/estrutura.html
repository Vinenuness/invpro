<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrutura - InvPro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:linear-gradient(135deg,#1e293b,#334155);padding:20px 30px;border-bottom:1px solid #475569;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:1.5rem}
.container{max-width:1400px;margin:0 auto;padding:30px}
.tenant-card{background:#1e293b;border-radius:16px;border:1px solid #334155;overflow:hidden;margin-bottom:20px}
.tenant-header{background:linear-gradient(135deg,#667eea,#764ba2);padding:20px;display:flex;justify-content:space-between;align-items:center}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:15px;padding:20px}
.unit-card{background:#0f172a;border-radius:12px;border:1px solid #334155;overflow:hidden}
.unit-header{background:linear-gradient(135deg,#10b981,#059669);padding:15px;display:flex;justify-content:space-between;align-items:center}
.locations{padding:15px}
.location-item{background:#1e293b;padding:10px 15px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:0.85rem;font-weight:500}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:white}
.btn-success{background:linear-gradient(135deg,#10b981,#059669);color:white}
.btn-back{background:#475569;color:white;padding:10px 20px;text-decoration:none;border-radius:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#1e293b;border-radius:16px;padding:30px;width:90%;max-width:500px;border:1px solid #475569}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;color:#94a3b8}
.form-group input{width:100%;padding:12px;background:#0f172a;border:1px solid #475569;border-radius:8px;color:white}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.badge{padding:4px 10px;border-radius:20px;font-size:0.75rem;background:#667eea;color:white}
.toast{position:fixed;bottom:30px;right:30px;background:#10b981;color:white;padding:15px 25px;border-radius:10px;display:none;z-index:2000}
.empty{text-align:center;padding:40px;color:#94a3b8}

</style>
</head>
<body>
<div class="header"><h1>Estrutura Organizacional</h1><div style="display:flex;gap:10px"><button class="btn btn-primary" id="btnNovaEmpresa">+ Nova Empresa</button><a href="/" class="btn-back">Voltar</a></div></div>
<div class="container"><div id="tree"></div></div>
<div id="modal-tenant" class="modal-overlay"><div class="modal"><h3>Empresa</h3><input type="hidden" id="edit-tenant-id"><div class="form-group"><label>Nome *</label><input type="text" id="tenant-name" placeholder="Ex: AHBB"></div><div class="form-group"><label>Slug</label><input type="text" id="tenant-slug"></div><div class="form-group"><label>Descricao</label><input type="text" id="tenant-desc"></div><div class="modal-actions"><button class="btn" id="cancelTenant" style="background:#475569;color:white">Cancelar</button><button class="btn btn-primary" id="saveTenantBtn">Salvar</button></div></div></div>
<div id="modal-unit" class="modal-overlay"><div class="modal"><h3>Unidade</h3><input type="hidden" id="edit-unit-id"><input type="hidden" id="unit-tenant-id"><div class="form-group"><label>Nome *</label><input type="text" id="unit-name" placeholder="Ex: Hospital Garca"></div><div class="form-group"><label>Descricao</label><input type="text" id="unit-desc"></div><div class="modal-actions"><button class="btn" id="cancelUnit" style="background:#475569;color:white">Cancelar</button><button class="btn btn-primary" id="saveUnitBtn">Salvar</button></div></div></div>
<div id="modal-location" class="modal-overlay"><div class="modal"><h3>Local</h3><input type="hidden" id="edit-location-id"><input type="hidden" id="location-unit-id"><div class="form-group"><label>Nome *</label><input type="text" id="location-name" placeholder="Ex: Administrativo"></div><div class="form-group"><label>Descricao</label><input type="text" id="location-desc"></div><div class="modal-actions"><button class="btn" id="cancelLocation" style="background:#475569;color:white">Cancelar</button><button class="btn btn-primary" id="saveLocationBtn">Salvar</button></div></div></div>
<div id="toast" class="toast"></div>

<script src="estrutura.js"></script>
</body>
</html>
