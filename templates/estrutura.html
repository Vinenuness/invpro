<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estrutura - AtivoFix</title>
<link rel="icon" href="/static/logo-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#0b0f19;color:#e2e8f0;min-height:100vh}
a{text-decoration:none}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid rgba(51,65,85,.35);background:rgba(15,23,42,.55);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;color:#3b82f6;font-size:14px;font-weight:600;margin-bottom:10px}
.toolbar h1{font-size:22px;font-weight:800;color:#f1f5f9;letter-spacing:-.02em}
.sub{font-size:13px;color:#64748b;margin-top:3px}
.container{max-width:1200px;margin:0 auto;padding:26px 28px 60px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;border:1px solid transparent;font:600 13px Inter;cursor:pointer;transition:all .15s;background:transparent;color:#cbd5e1;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb;box-shadow:0 4px 14px rgba(59,130,246,.35)}
.btn-ghost{border-color:rgba(148,163,184,.25);color:#e2e8f0}
.btn-ghost:hover{background:rgba(148,163,184,.12);border-color:rgba(148,163,184,.45);color:#fff}
.btn-danger{border-color:rgba(239,68,68,.45);color:#f87171}
.btn-danger:hover{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.7)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.company{background:rgba(17,24,39,.8);border:1px solid rgba(51,65,85,.4);border-radius:16px;margin-bottom:20px;overflow:hidden;transition:border-color .2s}
.company:hover{border-color:rgba(71,85,105,.7)}
.company-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid rgba(51,65,85,.3);flex-wrap:wrap}
.company-head h2{font-size:17px;font-weight:700;color:#f1f5f9;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.company-desc{font-size:12px;color:#64748b;margin-top:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 11px;border-radius:999px;background:rgba(56,189,248,.1);color:#7dd3fc;border:1px solid rgba(56,189,248,.22)}
.body{padding:20px 22px}
.units-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
.unit{background:#111827;border:1px solid rgba(51,65,85,.35);border-radius:12px;overflow:hidden}
.unit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(51,65,85,.3);flex-wrap:wrap}
.unit-head h3{font-size:14px;font-weight:600;color:#f8fafc;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.unit-desc{font-size:11px;color:#64748b;margin-top:2px;font-weight:400}
.locations{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.loc-row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(30,41,59,.55);border:1px solid rgba(51,65,85,.3);border-radius:9px;padding:9px 12px;transition:border-color .15s}
.loc-row:hover{border-color:rgba(51,65,85,.6)}
.loc-info{min-width:0}
.loc-name{font-size:13px;color:#e2e8f0;font-weight:600}
.loc-desc{font-size:11px;color:#64748b;margin-top:2px}
.add-loc{width:100%;padding:9px;margin-top:2px;border:1px dashed rgba(148,163,184,.35);background:transparent;color:#94a3b8;border-radius:9px;font:600 12.5px Inter;cursor:pointer;transition:all .15s}
.add-loc:hover{color:#7dd3fc;border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.06)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(2,6,23,.78);z-index:1000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:#111827;border:1px solid rgba(51,65,85,.6);border-radius:18px;padding:28px;width:100%;max-width:480px;box-shadow:0 25px 70px rgba(0,0,0,.55);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;font-weight:700;color:#f8fafc;margin-bottom:20px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#94a3b8;margin-bottom:6px}
.form-group input{width:100%;padding:11px 14px;background:rgba(30,41,59,.5);border:1px solid rgba(51,65,85,.5);border-radius:10px;color:#e2e8f0;font:400 14px Inter;outline:none;transition:all .15s}
.form-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.form-group input::placeholder{color:#475569}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.empty{text-align:center;padding:60px 20px;color:#64748b}
.empty h3{font-size:16px;color:#94a3b8;margin-bottom:8px}
.empty p{font-size:13px}
.toast{position:fixed;bottom:28px;right:28px;background:#16a34a;color:#fff;padding:13px 22px;border-radius:12px;font-weight:600;font-size:13px;display:none;z-index:2000;box-shadow:0 12px 32px rgba(0,0,0,.45)}
</style>
</head>
<body>

<div class="toolbar">
  <div>
    <a class="back" href="/">← Voltar</a>
    <h1>Estrutura Organizacional</h1>
    <p class="sub">Empresas, unidades e locais vinculados</p>
  </div>
  <button class="btn btn-primary" id="btnNovaEmpresa">+ Nova Empresa</button>
</div>

<div class="container"><div id="tree"></div></div>

<div id="modal-tenant" class="modal-overlay"><div class="modal">
  <h3>Empresa</h3>
  <input type="hidden" id="edit-tenant-id">
  <div class="form-group"><label>Nome *</label><input type="text" id="tenant-name" placeholder="Ex: AHBB"></div>
  <div class="form-group"><label>Slug</label><input type="text" id="tenant-slug" placeholder="Identificador curto"></div>
  <div class="form-group"><label>Descricao</label><input type="text" id="tenant-desc" placeholder="Opcional"></div>
  <div class="modal-actions"><button class="btn btn-ghost" id="cancelTenant">Cancelar</button><button class="btn btn-primary" id="saveTenantBtn">Salvar</button></div>
</div></div>

<div id="modal-unit" class="modal-overlay"><div class="modal">
  <h3>Unidade</h3>
  <input type="hidden" id="edit-unit-id"><input type="hidden" id="unit-tenant-id">
  <div class="form-group"><label>Nome *</label><input type="text" id="unit-name" placeholder="Ex: Hospital Garca"></div>
  <div class="form-group"><label>Descricao</label><input type="text" id="unit-desc" placeholder="Opcional"></div>
  <div class="modal-actions"><button class="btn btn-ghost" id="cancelUnit">Cancelar</button><button class="btn btn-primary" id="saveUnitBtn">Salvar</button></div>
</div></div>

<div id="modal-location" class="modal-overlay"><div class="modal">
  <h3>Local</h3>
  <input type="hidden" id="edit-location-id"><input type="hidden" id="location-unit-id">
  <div class="form-group"><label>Nome *</label><input type="text" id="location-name" placeholder="Ex: Administrativo"></div>
  <div class="form-group"><label>Descricao</label><input type="text" id="location-desc" placeholder="Opcional"></div>
  <div class="modal-actions"><button class="btn btn-ghost" id="cancelLocation">Cancelar</button><button class="btn btn-primary" id="saveLocationBtn">Salvar</button></div>
</div></div>

<div id="toast" class="toast"></div>
<script src="estrutura.js"></script>
</body>
</html>
